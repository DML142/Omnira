name: Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make check
      - name: Install pinned secret scanner
        env:
          GOBIN: /tmp/omnira-tools
        run: |
          GOTOOLCHAIN=go$(cat .go-version) go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo /tmp/omnira-tools >> "$GITHUB_PATH"
      - run: make secrets
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make check-go
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make check-web
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make check-infra
